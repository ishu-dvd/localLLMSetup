[project]
name = "localllm"
version = "0.1.0"
description = "Run one coding model on one laptop; use it from the others."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localllm = "localllm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
